# Human-readable Conda dependency specification for i2bRAD-M.
# Use `bash install.sh` for installation from the supplied Linux package lock.
# SOAP2 2.19 is installed by the accompanying installation script.

name: i2bRAD-M
channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  # Language runtimes and MAP2B Python/Perl stack
  - python=3.9.23
  - perl=5.26.2
  - perl-parallel-forkmanager=2.02
  - joblib=1.5.1
  - marisa-trie=0.7.7
  - numpy=1.26.4
  - pandas=2.3.1
  - pysam=0.23.3
  - scikit-learn=0.24.1
  - scipy=1.13.1
  - setuptools=80.9.0

  # Alignment, read-merging, and taxonomic-profiling tools
  - bowtie=1.3.0
  - tbb=2020.2
  - pear=0.9.6
  - kraken2=2.1.2=pl5262h7d875b9_0

  # Utilities used by project scripts
  - gzip
  - wget

  - libzlib=1.3.2
