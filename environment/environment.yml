# i2bRAD-M human-readable Conda dependency specification.
#
# IMPORTANT:
#   The publication-grade, clean-install-validated Linux x86_64 route is:
#       bash install.sh
#   which uses env/i2bRAD-M-linux-64.validated.lock.txt.
#
# This YAML is retained because it is the conventional Conda environment
# manifest expected in research software repositories. It expresses the
# intended direct dependencies, but the exact solve is not authoritative:
# Conda 4.12.0 on the validated CentOS 7 / glibc 2.17 host could not solve
# this legacy/modern combination from current repodata.
#
# SOAP2 2.19 is not listed here because the upstream Bioconda soapaligner
# package is 2.21 and has incompatible historical metadata. The validated
# installer adds the exact SOAP2 2.19 binaries after creating the environment.

name: i2bRAD-M
channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  # Language runtimes and MAP2B Python/Perl stack
  - python=3.9.23
  - perl=5.26.2
  - perl-parallel-forkmanager=2.02
  - joblib=1.5.1
  - marisa-trie=0.7.7
  - numpy=1.26.4
  - pandas=2.3.1
  - pysam=0.23.3
  - scikit-learn=0.24.1
  - scipy=1.13.1
  - setuptools=80.9.0

  # Alignment, read-merging, and taxonomic-profiling tools
  - bowtie=1.3.0
  - tbb=2020.2
  - pear=0.9.6
  - kraken2=2.1.2=pl5262h7d875b9_0

  # Utilities used by project scripts. In the exact validated installation,
  # gzip/wget are checked as host utilities because they were not Conda-managed
  # in the original validated package snapshot.
  - gzip
  - wget

  # zlib generation used by the validated combined runtime
  - libzlib=1.3.2
